<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>centopeia 0.1.0</title>
</head>

<body>
  <div id="app"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    const socket = io()

    socket.on('connect', () => {
      console.log('Connected to the server')
    })

    socket.on('disconnect', () => {
      console.log('Disconnected from the server')
    })

    const app = document.getElementById('app')

    fetch('/api/v1/health')
      .then(r => r.json())
      .then(data => app.innerText = 'API Response: ' + JSON.stringify(data))
      .catch(error => app.innerText = 'Error fetching API: ' + error)
      .finally(() => app.innerText += '\n\nSocket.io connection status: ' + (socket.connected ? 'Connected' : 'Disconnected'))
  </script>
</body>

</html>
